<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montaigne Lyceum - Huiswerk 4V - Periode 2</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2fa;--card:#ffffff;--ink:#1e1b36;--mute:#6b6a85;--line:#e1def0;--acc:#3263af;--acc-ink:#ffffff;--g1:#0086cd;--g2:#8e2f93;--grad:linear-gradient(120deg,var(--g1),#3263af 50%,var(--g2));--toets:#d6336c;--toets-bg:#fde8f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111f;--card:#1d1a30;--ink:#ece9fa;--mute:#a09fba;--line:#322e4d;--acc:#6aa8ff;--acc-ink:#0f0d1c;--g1:#2fa8f0;--g2:#c25fd0;--toets:#ff7aa8;--toets-bg:#3a1a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13111f;--card:#1d1a30;--ink:#ece9fa;--mute:#a09fba;--line:#322e4d;--acc:#6aa8ff;--acc-ink:#0f0d1c;--g1:#2fa8f0;--g2:#c25fd0;--toets:#ff7aa8;--toets-bg:#3a1a2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.id{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
.id b{display:block;font-size:1.05rem}
.id small{color:var(--mute);font-size:.82rem}
.cls{background:var(--acc);color:var(--acc-ink);font-weight:800;border-radius:10px;padding:6px 14px;font-size:1.1rem}
.lnk{font:inherit;font-size:.8rem;color:var(--acc);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;display:block;margin-top:2px}
.inp{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;margin:6px 0 14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer}
.chip input{width:20px;height:20px;accent-color:var(--c)}
.go{width:100%;font:inherit;font-weight:800;font-size:1.05rem;color:var(--acc-ink);background:var(--acc);border:0;border-radius:12px;padding:14px;cursor:pointer}
.err{color:var(--toets);min-height:1.3em;font-size:.9rem;margin:0 0 8px}
.inp:focus-visible,.go:focus-visible,.lnk:focus-visible,.chip:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.total{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mute)}
.row b{color:var(--ink)}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:thin}
nav button{flex:0 0 auto;min-width:86px;text-align:left;font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
nav button small{display:block;color:var(--mute);font-size:.75rem}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
nav button.on small{color:inherit;opacity:.85}
nav button.full::after{content:" ✓"}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 8px;flex-wrap:wrap}
.head h2{margin:0;font-size:1.2rem}
.hide{font-size:.85rem;color:var(--mute);display:flex;gap:6px;align-items:center;cursor:pointer}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem;color:var(--mute);margin-bottom:12px}
.vak{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:10px 14px 6px;margin-bottom:12px}
.vak h3{margin:0 0 4px;font-size:1rem;display:flex;justify-content:space-between;color:var(--ink)}
.vak h3 span{font-weight:400;font-size:.8rem;color:var(--mute)}
.vak h3{align-items:center;gap:8px;cursor:pointer;user-select:none}
.vak h3 .vn{font-style:normal;margin-right:auto}
.chev{display:inline-block;transition:transform .15s;font-size:.9rem;color:var(--mute)}
.vak.shut .chev{transform:rotate(-90deg)}
.vak.shut .t{display:none}
.vak.shut h3{margin-bottom:6px}
.vak h3:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.t{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.t:first-of-type{border-top:0}
.t input{width:22px;height:22px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--c);cursor:pointer}
.t input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.t span{flex:1;font-size:.94rem}
.t.done span{text-decoration:line-through;color:var(--mute)}
.tag{display:inline-block;font-size:.72rem;font-weight:800;color:var(--toets);background:var(--toets-bg);border-radius:6px;padding:1px 7px;margin-right:6px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
button.reset{font:inherit;font-size:.82rem;color:var(--mute);background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;margin-top:10px}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 38% at 0% 0%,color-mix(in srgb,var(--g1) 22%,transparent),transparent 72%),radial-gradient(55% 40% at 100% 4%,color-mix(in srgb,var(--g2) 20%,transparent),transparent 72%)}
h1,h2,.vak h3,.cls{font-family:'Baloo 2','Manrope',system-ui,sans-serif}
h1{font-size:1.95rem;line-height:1.1;letter-spacing:-.01em;margin:4px 0 2px}
.head h2{font-size:1.45rem}
.id{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;border-radius:22px;padding:12px 16px}
.logo{height:56px;width:auto;flex:0 0 auto}
.who{flex:1;min-width:0}
.who small{display:block}
.who b{display:block;font-size:1.1rem}
.cls{background:var(--grad);color:var(--acc-ink);border-radius:999px;padding:2px 18px;font-size:1.25rem;font-weight:800}
.id,.total,.vak,.note,.chip{box-shadow:0 10px 28px -20px rgba(60,40,140,.55)}
.total,.vak,.note{border-radius:20px}
.bar{height:10px}
.bar i{background:var(--grad)}
nav button{border-radius:999px;padding:8px 16px;min-width:0}
nav button.on{background:var(--grad);border-color:transparent;box-shadow:0 10px 20px -12px var(--g2)}
.vak{background:color-mix(in srgb,var(--c) 6%,var(--card))}
.vak h3{font-size:1.12rem;font-weight:800}
.t{border-top-color:color-mix(in srgb,var(--c) 14%,var(--line))}
.chip{border-radius:16px}
.chip:has(input:checked){background:color-mix(in srgb,var(--c) 13%,var(--card))}
.go{background:var(--grad);border-radius:16px;box-shadow:0 12px 24px -14px var(--g2)}
.lnk{color:var(--acc)}

.q{margin:0 0 12px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mini{font:inherit;font-size:.82rem;color:var(--acc);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:0 0 12px;padding:0 16px;box-shadow:0 10px 28px -20px rgba(60,40,140,.55)}
.card summary{cursor:pointer;padding:13px 0;font-family:'Baloo 2','Manrope',system-ui,sans-serif;font-weight:800;font-size:1.05rem}
.card summary span{font-weight:400;color:var(--mute);font-size:.9rem;margin-left:8px}
.card[open] summary{border-bottom:1px solid var(--line);margin-bottom:6px}
.card .t{--c:var(--acc)}
.meta{display:block;color:var(--mute);font-size:.78rem}
.nt{width:100%;font:inherit;font-size:.88rem;color:var(--ink);background:color-mix(in srgb,var(--c) 5%,var(--bg));border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:4px 0 10px;resize:vertical}
.vak.shut .nt{display:none}
.srch .head,.srch .wk,.srch #note,.srch #reset{display:none}
.seg{display:flex;gap:6px;margin:6px 0 10px}
.seg button,.pre button{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.seg .on{background:var(--grad);color:var(--acc-ink);border-color:transparent}
.tbox{padding-bottom:14px}
.trow[hidden]{display:none}
.tbox .inp{margin:0 0 10px;font-size:1rem;padding:10px 12px}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.trow input{width:80px;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
#tclock{font-family:'Baloo 2','Manrope',system-ui,sans-serif;font-size:3.2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
#tstat{text-align:center;color:var(--mute);margin-bottom:10px;min-height:1.4em}
.tacts{display:flex;gap:10px}.tacts button{flex:1}
.tacts .rs{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px;cursor:pointer}
.fin summary,.fin #tclock{color:var(--toets)}
.card input:focus-visible,.card button:focus-visible,.card summary:focus-visible,.mini:focus-visible,.nt:focus-visible,.seg button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

#app{padding-bottom:100px}
.tbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:8px;height:54px;min-width:54px;padding:0 15px;border:0;border-radius:999px;background:var(--grad);color:var(--acc-ink);font:inherit;font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;box-shadow:0 14px 28px -12px var(--g2)}
.tbtn span:empty{display:none}
.tbtn:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
body:has(#dTimer.fin) .tbtn{background:var(--toets);color:#fff}
.tpanel{position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 28px));max-height:calc(100vh - 120px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 16px 4px;box-shadow:0 24px 50px -18px rgba(40,20,100,.6);z-index:20}
.tpanel[hidden]{display:none}
.tphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-family:'Baloo 2','Manrope',system-ui,sans-serif;font-size:1.15rem}
.tpanel .mini:focus-visible,.tpanel input:focus-visible,.tpanel button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.srchbox{position:relative;margin:0 0 12px}
.srchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.srchbox:focus-within svg{color:var(--acc)}
.srchbox .inp{padding-left:46px;margin:0;border-radius:999px;box-shadow:0 10px 28px -22px rgba(60,40,140,.55)}
#dToets{border-color:color-mix(in srgb,var(--toets) 40%,var(--line))}
#dToets summary span{color:var(--toets);font-weight:800}

.credit{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.78rem;margin:18px 0 0}
.mode{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.15rem;cursor:pointer}
.tb{display:block;flex:1;min-width:0}
.ac{display:flex;gap:2px;flex:0 0 auto}
.ic{background:none;border:0;color:var(--mute);font-size:1.2rem;cursor:pointer;padding:0 4px;line-height:1.2}
.ic.on{color:#f5a524}
.dlb{font:inherit;font-size:.76rem;border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:1px 10px;margin-top:5px;cursor:pointer}
.dlb.soon{color:#b7791f;border-color:#f5c26b}
.dlb.late{color:var(--toets);border-color:var(--toets)}
.tag.mine{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.t.done span.tb{text-decoration:none;color:inherit}
.t.done .tx{text-decoration:line-through;color:var(--mute)}
.addf{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:14px}
.addf input,.addf select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.addf .wide{grid-column:1/-1}
.pv{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;padding:6px 0;font-size:.9rem}
.pv b{text-align:right;font-weight:600;color:var(--mute);font-size:.8rem}
.pv .bar{margin:0}
.grp{margin:8px 0 2px;font-weight:800;color:var(--ink)}
.ic:focus-visible,.dlb:focus-visible,.mode:focus-visible,.addf :focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.ttl{display:flex;align-items:center;gap:10px}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:var(--grad);color:var(--acc-ink);font:inherit;font-size:1.6rem;font-weight:600;line-height:1;cursor:pointer;box-shadow:0 10px 20px -12px var(--g2)}
.plus:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.addp{right:auto;left:50%;bottom:auto;top:16%;transform:translateX(-50%);width:min(380px,calc(100vw - 28px));z-index:30}
.vak h3 .vn{margin-right:0}
.vak h3 .vp{margin-right:auto;display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.vb{display:inline-block;width:64px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.vb i{display:block;height:100%;background:var(--c);border-radius:99px}

.flt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.flt button{font:inherit;font-size:.85rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.flt .on{background:var(--grad);color:var(--acc-ink);border-color:transparent}
.flt button:focus-visible,.swb:focus-visible,.own input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.srch .flt{display:none}
.dot{display:block;width:20px;height:20px;border-radius:50%;background:var(--grad);margin:0 auto}
.palp{top:84px;bottom:auto}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.swb{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swb.on{box-shadow:0 0 0 3px var(--acc)}
.own{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.9rem}
.own input{width:44px;height:32px;border:0;padding:0;background:none;cursor:pointer}

/* V2 Layout uitbreiding voor kolommen & stats */
.vak-grid { display: grid; grid-template-columns: 1fr 220px; gap: 12px; align-items: start; }
@media (max-width: 600px) { .vak-grid { grid-template-columns: 1fr; } }
.vak-stats-col { background: color-mix(in srgb, var(--c) 4%, var(--bg)); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 0.84rem; display: flex; flex-direction: column; gap: 6px; }
.vak-stats-col b { color: var(--ink); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 14px; }
.modal-overlay[hidden] { display: none; }
.modal-box { background: var(--card); border: 1px solid var(--line); border-radius: 20px; width: min(440px, 100%); padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); z-index: 101; }
.modal-box h3 { margin-top: 0; font-family: 'Baloo 2', sans-serif; }
</style>
</head>
